default_agent: codex
default_profile: balanced

agents:
  codex:
    bin: codex
    provider: codex
    model_id_prefix: false
  opencode-go:
    bin: opencode
    provider: opencode-go
    model_id_prefix: true

profiles:
  codex-fast:
    agent: codex
    model: gpt-5.6-luna
  codex-balanced:
    agent: codex
    model: gpt-5.6-terra
  codex-frontier:
    agent: codex
    model: gpt-5.6-sol
    effort: high
  opencode-fast:
    agent: opencode-go
    model: deepseek-v4-flash
  opencode-balanced:
    agent: opencode-go
    model: deepseek-v4-pro
  opencode-frontier:
    agent: opencode-go
    model: kimi-k2.7-code

multiplexer:
  default: herdr
  herdr:
    enabled: true
